<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>

    <title>Хрестики-Нулики</title>
</head>

<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <main class="game-container">
        <header class="header">
            <h1 class="game-title">Хрестики <span class="accent">Нулики</span></h1>

            <div class="controls-bar">
                <div class="mode-selector">
                    <button id="modePvp" class="mode-btn active" title="Грати удвох на одному екрані">👥 2 Гравці</button>
                    <button id="modeAi" class="mode-btn" title="Грати проти комп'ютера">🤖 Проти ШІ</button>
                </div>

                <div class="extra-controls">
                    <!-- Випадаючий список складності (показується тільки в режимі "Проти ШІ") -->
                    <select id="aiDifficulty" class="select-difficulty hidden" title="Рівень складності ШІ">
                        <option value="easy">Легкий</option>
                        <option value="hard" selected>Непереможний (ШІ)</option>
                    </select>
                    <!-- Кнопка ввімкнення / вимкнення звуку -->
                    <button id="soundToggle" class="icon-btn" title="Увімкнути / Вимкнути звук">🔊</button>
                </div>
            </div>
        </header>

        <!-- Блок підрахунку очок (Scoreboard) -->
        <section class="score-board">
            <!-- Картка рахунку Гравця X -->
            <div class="score-card player-x active-glow" id="cardX">
                <span class="player-icon">✕</span>
                <div class="score-info">
                    <span class="player-label" id="labelX">Гравець X</span>
                    <span class="score-num" id="scoreX">0</span>
                </div>
            </div>
            <!-- Картка рахунку Нічиїх -->
            <div class="score-card tie" id="cardTie">
                <span class="player-icon">🤝</span>
                <div class="score-info">
                    <span class="player-label">Нічиї</span>
                    <span class="score-num" id="scoreTies">0</span>
                </div>
            </div>
        </section>

        <!-- Обгортка ігрового поля 3x3 -->
        <section class="board-wrapper">
            <div class="board" id="board">
                <!-- 9 клітинок ігрового поля з атрибутом data-index (від 0 до 8) -->
                <button class="cell" data-index="0" aria-label="Клітинка 1"></button>
                <button class="cell" data-index="1" aria-label="Клітинка 2"></button>
                <button class="cell" data-index="2" aria-label="Клітинка 3"></button>
                <button class="cell" data-index="3" aria-label="Клітинка 4"></button>
                <button class="cell" data-index="4" aria-label="Клітинка 5"></button>
                <button class="cell" data-index="5" aria-label="Клітинка 6"></button>
                <button class="cell" data-index="6" aria-label="Клітинка 7"></button>
                <button class="cell" data-index="7" aria-label="Клітинка 8"></button>
                <button class="cell" data-index="8" aria-label="Клітинка 9"></button>
            </div>
            <!-- Елемент лінії перемоги (перекреслювання комбінації) -->
            <div class="win-line" id="winLine"></div>
        </section>

        <!-- Нижня панель з кнопками керування -->
        <footer class="footer-actions">
            <!-- Кнопка очищення поля для нового раунду -->
            <button id="resetRoundBtn" class="action-btn primary">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                    <path d="M16 21h5v-5"/>
                </svg>
                Новий раунд
            </button>
            <!-- Кнопка повного обнулення рахунку очок -->
            <button id="resetScoreBtn" class="action-btn secondary" title="Скинути всі очки до нуля">
                Скинути рахунок
            </button>
        </footer>
    </main>

    <!-- Модальне спливаюче вікно при перемозі або нічиїй -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-card">
            <div class="winner-emoticon" id="modalEmoji">🎉</div>
            <h2 class="modal-title" id="modalTitle">Перемога Гравець X!</h2>
            <p class="modal-subtitle" id="modalSubtitle">Чудова гра, так тримати!</p>
            <div class="modal-actions">
                <button id="modalNextBtn" class="action-btn primary">Наступний раунд</button>
            </div>
        </div>
    </div>

    <!-- Canvas для малювання святкового салюту / конфеті -->
    <canvas id="confettiCanvas"></canvas>

</body>

</html>
